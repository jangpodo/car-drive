
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #1f2937;
  }

  #wrap {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    width: 100%;
  }

  #board {
    flex: 1;
    min-width: 0;
    display: grid;
    gap: 2px;
    background: #d1d5db;
    padding: 3px;
    border-radius: 8px;
  }

  .cell {
    min-width: 0;
    aspect-ratio: 1;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(8px, 1.5vw, 18px);
    cursor: crosshair;
    user-select: none;
  }

  .cell.obstacle {
    background: #374151;
  }

  .cell.start {
    background: #16a34a;
    color: white;
    font-weight: bold;
  }

  .cell.goal {
    background: #dc2626;
    color: white;
    font-weight: bold;
  }

  .cell.preview {
    outline: 2px solid #7c3aed;
    outline-offset: -2px;
  }

  #tools {
    width: 145px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .tool {
    padding: 11px 8px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
    font-size: 14px;
    text-align: center;
  }

  .tool.active {
    background: #e0e7ff;
    border: 2px solid #4f46e5;
    font-weight: bold;
  }

  #hint {
    font-size: 12px;
    color: #64748b;
    line-height: 1.5;
    margin-top: 4px;
  }

  @media (max-width:600px) {
    #wrap {
      gap: 8px;
    }

    #tools {
      width: 112px;
    }

    .tool {
      font-size: 12px;
      padding: 9px 4px;
    }
  }
</style>
</head>

<body>

<div id="wrap">

  <div id="board" aria-label="지도"></div>

  <aside id="tools">

    <button class="tool active" data-mode="start">
      🟢 출발점
    </button>

    <button class="tool" data-mode="goal">
      🔴 종착점
    </button>

    <button class="tool" data-mode="obstacle">
      ⬛ 장애물
    </button>

    <button class="tool" data-mode="erase">
      ⌫ 블럭 삭제
    </button>

    <div id="hint">
      1. 오른쪽에서 기능 선택<br>
      2. 원하는 칸에 마우스를 올림<br>
      3. 키보드 F를 눌러 설치
    </div>

  </aside>

</div>

<script>

(function(){

  let args = {};
  let mode = "start";
  let hoverCell = null;
  let lastSent = "";

  const board = document.getElementById("board");

  const toolButtons = [
    ...document.querySelectorAll(".tool")
  ];

  function send(value) {

    const serialized = JSON.stringify(value);

    if (serialized === lastSent) return;

    lastSent = serialized;

    window.parent.postMessage({

      isStreamlitMessage: true,

      type: "streamlit:setComponentValue",

      value: value

    }, "*");

  }

  function setHeight() {

    const h = Math.max(
      250,
      board.getBoundingClientRect().height + 10
    );

    window.parent.postMessage({

      isStreamlitMessage: true,

      type: "streamlit:setFrameHeight",

      height: h

    }, "*");

  }

  function render() {

    const rows = args.rows || 20;
    const cols = args.cols || 20;

    const obstacles = new Set(
      args.obstacles || []
    );

    board.style.gridTemplateColumns =
      `repeat(${cols}, minmax(0, 1fr))`;

    board.innerHTML = "";

    for (let r = 0; r < rows; r++) {

      for (let c = 0; c < cols; c++) {

        const key = `${r},${c}`;

        const el = document.createElement("div");

        el.className = "cell";

        el.dataset.r = r;
        el.dataset.c = c;

        if (obstacles.has(key)) {

          el.classList.add("obstacle");
          el.textContent = "";

        }

        if (args.start === key) {

          el.classList.add("start");
          el.textContent = "S";

        }

        if (args.goal === key) {

          el.classList.add("goal");
          el.textContent = "G";

        }

        el.addEventListener("mouseenter", () => {

          hoverCell = key;

          el.classList.add("preview");

        });

        el.addEventListener("mouseleave", () => {

          hoverCell = null;

          el.classList.remove("preview");

        });

        board.appendChild(el);

      }

    }

    setHeight();

  }

  // 오른쪽 도구 버튼 선택

  toolButtons.forEach(btn => {

    btn.addEventListener("click", () => {

      mode = btn.dataset.mode;

      toolButtons.forEach(b => {

        b.classList.toggle(
          "active",
          b === btn
        );

      });

    });

  });

  // F 키를 누르면 선택한 기능 실행

  document.addEventListener("keydown", e => {

    if (
      e.key.toLowerCase() !== "f"
      || !hoverCell
    ) {
      return;
    }

    if (
      ["INPUT", "TEXTAREA"].includes(
        document.activeElement.tagName
      )
    ) {
      return;
    }

    e.preventDefault();

    send({

      action: mode,

      cell: hoverCell,

      nonce: Date.now()

    });

  });

  // Streamlit에서 새로운 지도 정보 수신

  window.addEventListener("message", event => {

    const msg = event.data;

    if (
      msg &&
      msg.type === "streamlit:render"
    ) {

      args = msg.args || {};

      lastSent = "";

      render();

    }

  });

  // Streamlit 컴포넌트 초기화

  window.parent.postMessage({

    isStreamlitMessage: true,

    type: "streamlit:componentReady",

    apiVersion: 1

  }, "*");

  window.parent.postMessage({

    isStreamlitMessage: true,

    type: "streamlit:setFrameHeight",

    height: 500

  }, "*");

})();

</script>

</body>
</html>
